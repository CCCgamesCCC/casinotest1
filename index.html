<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Casino Mini App</title>
  <!-- Подключение SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      background: #121214;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .balance-box {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 24px;
      color: #f5a623;
    }
    .machine {
      background: #1f2024;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #2d3038;
      display: flex;
      gap: 15px;
    }
    .reel {
      width: 75px;
      height: 90px;
      background: #0d0d0f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 1px solid #333;
    }
    .controls {
      margin-top: 30px;
    }
    .spin-btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }
    .spin-btn:active {
      transform: scale(0.96);
    }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result-text {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="balance-box">Баланс: <span id="balance">1000</span> 🪙</div>

  <div class="machine">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">7️⃣</div>
  </div>

  <div class="result-text" id="result">Сделайте спин! (Ставка: 50)</div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
  </div>

  <script>
    // Инициализация Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем окно на весь экран
    }

    const symbols = ["🍒", "🍋", "🍇", "🔔", "7️⃣"];
    let balance = 1000;
    const bet = 50;

    const r1 = document.getElementById("reel1");
    const r2 = document.getElementById("reel2");
    const r3 = document.getElementById("reel3");
    const balanceEl = document.getElementById("balance");
    const resultEl = document.getElementById("result");
    const spinBtn = document.getElementById("spinBtn");

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function spin() {
      if (balance < bet) {
        resultEl.innerText = "Недостаточно фишек!";
        return;
      }

      balance -= bet;
      balanceEl.innerText = balance;
      spinBtn.disabled = true;
      resultEl.innerText = "Барабаны крутятся...";

      // Эффект вибрации смартфона через Telegram API
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("medium");
      }

      // Быстрая смена иконок (имитация вращения)
      let ticks = 0;
      const interval = setInterval(() => {
        r1.innerText = getRandomSymbol();
        r2.innerText = getRandomSymbol();
        r3.innerText = getRandomSymbol();
        ticks++;

        if (ticks > 15) {
          clearInterval(interval);
          finalizeSpin();
        }
      }, 70);
    }

    function finalizeSpin() {
      const s1 = getRandomSymbol();
      const s2 = getRandomSymbol();
      const s3 = getRandomSymbol();

      r1.innerText = s1;
      r2.innerText = s2;
      r3.innerText = s3;
