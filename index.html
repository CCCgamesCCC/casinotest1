<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real Multiplayer Live Roulette</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --gold: #f6c343;
      --gold-dark: #b8860b;
      --felt: #0c2015;
      --felt-light: #163624;
      --felt-border: #275237;
      --red: #d32020;
      --black: #1a1a1a;
      --green: #158a43;
      --card-bg: rgba(14, 26, 18, 0.95);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 15%, #162c1e 0%, #060b07 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px 30px;
    }

    /* Верхняя панель */
    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--felt-border);
      border-radius: 12px;
      margin-bottom: 6px;
    }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 0.75rem; color: #8da995; font-weight: 600; }
    .user-balance { font-size: 1.15rem; font-weight: 800; color: var(--gold); }

    .online-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #4ade80;
      font-weight: 700;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* История */
    .history-row {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .history-title { font-size: 0.65rem; color: #799782; font-weight: 800; }
    .history-strip { display: flex; gap: 4px; overflow-x: auto; }
    .history-item {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
    }
    .h-red { background: var(--red); }
    .h-black { background: var(--black); border: 1px solid #444; }
    .h-green { background: var(--green); }

    /* Колесо */
    .wheel-container {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 2px auto 6px;
    }
    canvas#wheelCanvas {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8), 0 0 0 5px #193121, 0 0 0 7px var(--gold-dark);
    }

    /* Статус и таймер */
    .status-panel {
      width: 100%;
      max-width: 440px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--card-bg);
      border: 1px solid var(--felt-border);
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 4px 10px;
      text-align: center;
    }
    .countdown-pill {
      background: #c22929;
      color: #fff;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 6px;
    }

    /* Поле ввода ставки */
    .bet-input-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--felt-border);
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bet-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bet-label { font-size: 0.75rem; color: #8da995; font-weight: 700; }
    .custom-input {
      flex: 1;
      height: 32px;
      background: #08130c;
      border: 1px solid var(--felt-border);
      border-radius: 6px;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .quick-chips {
      display: flex;
      gap: 5px;
      justify-content: space-between;
    }
    .q-btn {
      flex: 1;
      height: 24px;
      background: #193724;
      border: 1px solid #285538;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
    }
    .q-btn:active { background: #265538; }

    /* Стол */
    .table-felt {
      width: 100%;
      max-width: 440px;
      background: var(--felt);
      border: 2px solid var(--felt-border);
      border-radius: 10px;
      padding: 6px;
    }
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      border-radius: 4px;
    }
    .cell:active { opacity: 0.8; }
    .table-badge {
      position: absolute;
      background: var(--gold);
      color: #000;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 6px;
      z-index: 5;
      pointer-events: none;
    }
    .cell-zero { background: var(--green); height: 28px; margin-bottom: 3px; font-size: 0.8rem; }
    .grid-numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 3px;
    }
    .grid-numbers .cell { height: 30px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.06); }
    .col-red { background: var(--red); }
    .col-black { background: var(--black); }

    .grid-dozens, .grid-outside-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 3px;
    }
    .grid-outside-6 { grid-template-columns: repeat(6, 1fr); }
    .cell-sector { background: var(--felt-light); border: 1px solid var(--felt-border); height: 28px; font-size: 0.72rem; }

    .table-actions { display: flex; gap: 6px; margin-top: 6px; }
    .act-btn {
      flex: 1;
      height: 30px;
      background: #1c3625;
      border: 1px solid #2e5a3e;
      color: #bfe5cc;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    /* КОМПАКТНАЯ ИСТОРИЯ СТАВОК */
    .players-bets-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--felt-border);
      border-radius: 10px;
      margin-top: 8px;
      padding: 8px 10px;
    }
    .bets-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a3824;
      padding-bottom: 4px;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold);
    }
    .bets-compact-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 150px;
      overflow-y: auto;
    }
    .user-bet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 45, 30, 0.7);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 5px 8px;
    }
    .user-bet-row.is-me {
      border-color: var(--gold-dark);
      background: rgba(246, 195, 67, 0.08);
    }
    .u-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .u-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #254b33;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }
    .u-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .u-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #e5e7eb;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .u-targets {
      font-size: 0.65rem;
      color: #8da995;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .u-total {
      text-align: right;
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--gold);
      flex-shrink: 0;
      margin-left: 8px;
    }
    .empty-note {
      font-size: 0.72rem;
      color: #5c7965;
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="user-info">
      <span class="user-name" id="userName">Игрок</span>
      <span class="user-balance"><span id="balanceVal">...</span> 🪙</span>
    </div>
    <div class="online-indicator">
      <div class="pulse-dot"></div>
      Онлайн: <span id="onlineCount">1</span>
    </div>
  </div>

  <div class="history-row">
    <span class="history-title">ИСТОРИЯ:</span>
    <div class="history-strip" id="historyStrip"></div>
  </div>

  <div class="wheel-container">
    <canvas id="wheelCanvas" width="420" height="420"></canvas>
  </div>

  <div class="status-panel" id="statusPanel">
    Делайте ваши ставки <span class="countdown-pill" id="timerBadge">15с</span>
  </div>

  <!-- Блок ввода ставки -->
  <div class="bet-input-card">
    <div class="bet-input-row">
      <span class="bet-label">Ставка:</span>
      <input type="number" id="customBetInput" class="custom-input" value="50" min="10" step="10">
    </div>
    <div class="quick-chips">
      <button class="q-btn" onclick="adjustBet('set', 10)">MIN</button>
      <button class="q-btn" onclick="adjustBet('add', 50)">+50</button>
      <button class="q-btn" onclick="adjustBet('add', 100)">+100</button>
      <button class="q-btn" onclick="adjustBet('mult', 2)">x2</button>
      <button class="q-btn" onclick="adjustBet('allin', 0)">ALL IN</button>
    </div>
  </div>

  <!-- Стол -->
  <div class="table-felt">
    <div class="cell cell-zero" onclick="handleCellClick('number', '0', 36, this)">0 Зеро (x36)</div>
    <div class="grid-numbers" id="numbersTable"></div>
    <div class="grid-dozens">
      <div class="cell cell-sector" onclick="handleCellClick('doz1', '1-12', 3, this)">1 - 12 (x3)</div>
      <div class="cell cell-sector" onclick="handleCellClick('doz2', '13-24', 3, this)">13 - 24 (x3)</div>
      <div class="cell cell-sector" onclick="handleCellClick('doz3', '25-36', 3, this)">25 - 36 (x3)</div>
    </div>
    <div class="grid-outside-6">
      <div class="cell cell-sector" onclick="handleCellClick('low', '1-18', 2, this)">1-18</div>
      <div class="cell cell-sector" onclick="handleCellClick('even', 'ЧЁТ', 2, this)">ЧЁТ</div>
      <div class="cell col-red" onclick="handleCellClick('red', 'КРАСН', 2, this)">КРАСН</div>
      <div class="cell col-black" onclick="handleCellClick('black', 'ЧЁРН', 2, this)">ЧЁРН</div>
      <div class="cell cell-sector" onclick="handleCellClick('odd', 'НЕЧ', 2, this)">НЕЧ</div>
      <div class="cell cell-sector" onclick="handleCellClick('high', '19-36', 2, this)">19-36</div>
    </div>
    <div class="table-actions">
      <button class="act-btn" onclick="clearMyBets()">Очистить ставки</button>
      <button class="act-btn" onclick="doubleMyBets()">x2 Удвоить мои</button>
    </div>
  </div>

  <!-- Компактная история ставок игроков -->
  <div class="players-bets-card">
    <div class="bets-header">
      <span>👥 СТАВКИ ИГРОКОВ В РАУНДЕ</span>
      <span>Банк: <b id="roundTotalBank" style="color:var(--gold);">0</b> 🪙</span>
    </div>
    <div class="bets-compact-list" id="compactBetsList">
      <div class="empty-note">Ставок пока нет</div>
    </div>
  </div>

  <script>
    // 1. Инициализация Telegram
    const tg = window.Telegram?.WebApp;
    let myId = "local_" + Math.random().toString(36).substring(2, 7);
    let myName = "Игрок";

    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.disableVerticalSwipes?.();
        if (tg.initDataUnsafe?.user) {
          myId = tg.initDataUnsafe.user.id.toString();
          myName = tg.initDataUnsafe.user.first_name || "Игрок";
        }
      } catch (e) {}
    }
    document.getElementById('userName').innerText = myName;

    function safeHaptic(t) {
      try {
        if (tg?.HapticFeedback) {
          if (t === 'tap') tg.HapticFeedback.impactOccurred('light');
          if (t === 'spin') tg.HapticFeedback.impactOccurred('medium');
          if (t === 'win') tg.HapticFeedback.notificationOccurred('success');
        }
      } catch (e) {}
    }

    // 2. Колесо
    const wheelOrder = [
      0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
      5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    // 3. Состояние
    let balance = 1000;
    const STORAGE_KEY = "roulette_multi_v3_bal";
    let roundPhase = "betting";
    let myBets = {}; // targetKey -> { type, target, mult, amount, cellEl }
    let allBetsList = []; // сырой список всех ставок игроков
    let gameHistory = [26, 3, 0, 19, 12];

    // 4. Управление полем ввода ставки
    const betInput = document.getElementById('customBetInput');
    function getSelectedAmount() {
      let val = parseInt(betInput.value, 10);
      if (isNaN(val) || val < 10) val = 10;
      return val;
    }
    function adjustBet(action, val) {
      let cur = getSelectedAmount();
      if (action === 'set') cur = val;
      if (action === 'add') cur += val;
      if (action === 'mult') cur *= val;
      if (action === 'allin') cur = balance;
      if (cur > balance) cur = Math.max(10, balance);
      if (cur < 10) cur = 10;
      betInput.value = cur;
      safeHaptic('tap');
    }

    // 5. Баланс
    function updateBalanceUI() {
      document.getElementById('balanceVal').innerText = balance;
    }
    function saveBalance() {
      updateBalanceUI();
      try { localStorage.setItem(STORAGE_KEY, balance.toString()); } catch(e){}
      try { tg?.CloudStorage?.setItem?.(STORAGE_KEY, balance.toString(), ()=>{}); } catch(e){}
    }
    function loadBalance() {
      const loc = localStorage.getItem(STORAGE_KEY);
      if (loc) balance = parseInt(loc, 10);
      if (isNaN(balance) || balance < 10) balance = 1000;
      updateBalanceUI();
    }

    // 6. Отрисовка стола и номеров
    function buildBoard() {
      const cont = document.getElementById('numbersTable');
      cont.innerHTML = '';
      for (let i = 1; i <= 36; i++) {
        const isRed = redNumbers.includes(i);
        const cell = document.createElement('div');
        cell.className = `cell ${isRed ? 'col-red' : 'col-black'}`;
        cell.innerText = i;
        cell.onclick = function() { handleCellClick('number', i.toString(), 36, this); };
        cont.appendChild(cell);
      }
    }

    function renderHistory() {
      const strip = document.getElementById('historyStrip');
      strip.innerHTML = '';
      gameHistory.slice(-7).reverse().forEach(n => {
        const el = document.createElement('div');
        let c = 'h-black';
        if (n === 0) c = 'h-green';
        else if (redNumbers.includes(n)) c = 'h-red';
        el.className = `history-item ${c}`;
        el.innerText = n;
        strip.appendChild(el);
      });
    }

    // 7. Ставки игрока
    function handleCellClick(type, target, mult, cellEl) {
      if (roundPhase !== 'betting') return;
      const amt = getSelectedAmount();
      if (balance < amt) return;

      balance -= amt;
      saveBalance();

      const key = `${type}_${target}`;
      if (!myBets[key]) {
        myBets[key] = { type, target, mult, amount: amt, cellEl };
      } else {
        myBets[key].amount += amt;
      }

      const betObj = {
        user_id: myId,
        user_name: myName,
        type,
        target,
        mult,
        amount: amt
      };

      // Отправляем на сервер WebSocket (если есть) или обрабатываем локально
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "place_bet", bet: betObj }));
      } else {
        registerNewBet(betObj);
      }

      updateMyTableBadges();
      safeHaptic('tap');
    }

    function clearMyBets() {
      if (roundPhase !== 'betting') return;
      const total = Object.values(myBets).reduce((s, b) => s + b.amount, 0);
      if (total === 0) return;

      balance += total;
      saveBalance();
      myBets = {};
      allBetsList = allBetsList.filter(b => b.user_id !== myId);
      document.querySelectorAll('.table-badge').forEach(b => b.remove());
      renderCompactBets();
    }

    function doubleMyBets() {
      if (roundPhase !== 'betting') return;
      const total = Object.values(myBets).reduce((s, b) => s + b.amount, 0);
      if (total === 0 || balance < total) return;

      balance -= total;
      saveBalance();

      for (let k in myBets) {
        const bet = myBets[k];
        const addAmt = bet.amount;
        bet.amount *= 2;

        const betObj = {
          user_id: myId,
          user_name: myName,
          type: bet.type,
          target: bet.target,
          mult: bet.mult,
          amount: addAmt
        };
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: "place_bet", bet: betObj }));
        } else {
          registerNewBet(betObj);
        }
      }
      updateMyTableBadges();
      safeHaptic('tap');
    }

    function updateMyTableBadges() {
      for (let k in myBets) {
        const b = myBets[k];
        let badge = b.cellEl.querySelector('.table-badge');
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'table-badge';
          b.cellEl.appendChild(badge);
        }
        badge.innerText = b.amount >= 1000 ? (b.amount/1000).toFixed(1) + 'k' : b.amount;
      }
    }

    function registerNewBet(bet) {
      allBetsList.push(bet);
      renderCompactBets();
    }

    // 8. Компактное отображение ставок по игрокам
    function renderCompactBets() {
      const cont = document.getElementById('compactBetsList');
      cont.innerHTML = '';

      const totalBank = allBetsList.reduce((s, b) => s + b.amount, 0);
      document.getElementById('roundTotalBank').innerText = totalBank;

      if (allBetsList.length === 0) {
        cont.innerHTML = '<div class="empty-note">Ставок пока нет</div>';
        return;
      }

      // Группируем по пользователю
      const grouped = {};
      allBetsList.forEach(b => {
        if (!grouped[b.user_id]) {
          grouped[b.user_id] = {
            id: b.user_id,
            name: b.user_name,
            total: 0,
            targets: []
          };
        }
        grouped[b.user_id].total += b.amount;
        grouped[b.user_id].targets.push(b.target);
      });

      Object.values(grouped).forEach(g => {
        const isMe = (g.id === myId);
        const row = document.createElement('div');
        row.className = `user-bet-row ${isMe ? 'is-me' : ''}`;

        // Компактный список секторов
        const uniqueTargets = [...new Set(g.targets)].join(', ');

        row.innerHTML = `
          <div class="u-left">
            <div class="u-avatar">${g.name[0].toUpperCase()}</div>
            <div class="u-details">
              <span class="u-name">${g.name} ${isMe ? '(Вы)' : ''}</span>
              <span class="u-targets">${uniqueTargets}</span>
            </div>
          </div>
          <div class="u-total">${g.total} 🪙</div>
        `;
        cont.appendChild(row);
      });
    }

    // 9. Canvas Колесо и Анимация шарика
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const totalSlices = wheelOrder.length;
    const sliceAngle = (2 * Math.PI) / totalSlices;
    let currentWheelAngle = 0;

    function drawWheel(angle, ball) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = cx - 10;

      ctx.beginPath();
      ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
      ctx.fillStyle = '#15261d';
      ctx.fill();
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#b8860b';
      ctx.stroke();

      for (let i = 0; i < totalSlices; i++) {
        const st = angle + i * sliceAngle;
        const num = wheelOrder[i];

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, st, st + sliceAngle);
        ctx.lineTo(cx, cy);

        if (num === 0) ctx.fillStyle = '#158a43';
        else if (redNumbers.includes(num)) ctx.fillStyle = '#c51d1d';
        else ctx.fillStyle = '#1c1c1c';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#2b2b2b';
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(st + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px -apple-system, sans-serif';
        ctx.fillText(num.toString(), r - 12, 5);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, 2 * Math.PI);
      ctx.fillStyle = '#1c1c1c';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#f6c343';
      ctx.stroke();

      if (ball) {
        const bx = cx + Math.cos(ball.angle) * ball.radius;
        const by = cy + Math.sin(ball.angle) * ball.radius;
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function animateSpin(winIndex, winNumber, duration, onComplete) {
      safeHaptic('spin');
      const startTime = performance.now();
      const initialWheel = currentWheelAngle;
      const targetWheel = initialWheel + (3.5 * 2 * Math.PI);
      const cx = canvas.width / 2;
      const trackR = cx - 15;
      const pocketR = cx - 36;

      function frame(now) {
        const elapsed = now - startTime;
        const p = Math.min(elapsed / duration, 1);
        const easeWheel = 1 - Math.pow(1 - p, 2.5);
        currentWheelAngle = initialWheel + (targetWheel - initialWheel) * easeWheel;

        const ballSpeed = 1 - Math.pow(1 - p, 2);
        let bAngle = -(7 * 2 * Math.PI * ballSpeed);
        let bRad = trackR;

        if (p > 0.65) {
          const dropP = (p - 0.65) / 0.35;
          const bounce = Math.sin(dropP * Math.PI * 3) * (1 - dropP) * 5;
          bRad = trackR - (trackR - pocketR) * (1 - Math.pow(1 - dropP, 2)) + bounce;
        }
        if (p >= 0.95) {
          bAngle = currentWheelAngle + (winIndex * sliceAngle) + (sliceAngle / 2);
          bRad = pocketR;
        }

        drawWheel(currentWheelAngle, { angle: bAngle, radius: bRad });

        if (p < 1) requestAnimationFrame(frame);
        else onComplete();
      }
      requestAnimationFrame(frame);
    }

    function calculateMyPayout(winNum) {
      let wonAmount = 0;
      for (let k in myBets) {
        const b = myBets[k];
        let won = false;
        if (b.type === 'number') won = (parseInt(b.target, 10) === winNum);
        else if (winNum > 0) {
          if (b.type === 'red') won = redNumbers.includes(winNum);
          if (b.type === 'black') won = !redNumbers.includes(winNum);
          if (b.type === 'even') won = (winNum % 2 === 0);
          if (b.type === 'odd') won = (winNum % 2 !== 0);
          if (b.type === 'low') won = (winNum >= 1 && winNum <= 18);
          if (b.type === 'high') won = (winNum >= 19 && winNum <= 36);
          if (b.type === 'doz1') won = (winNum >= 1 && winNum <= 12);
          if (b.type === 'doz2') won = (winNum >= 13 && winNum <= 24);
          if (b.type === 'doz3') won = (winNum >= 25 && winNum <= 36);
        }
        if (won) wonAmount += b.amount * b.mult;
      }
      return wonAmount;
    }

    // 10. Подключение к серверу синхронизации (WebSocket)
    // Укажите адрес вашего сервера на Render / VPS или оставьте fallback
    const WS_SERVER_URL = "wss://YOUR-SERVER-NAME.onrender.com/ws";
    let ws = null;

    function connectWebSocket() {
      try {
        ws = new WebSocket(WS_SERVER_URL);
        ws.onopen = () => console.log("Онлайн-сервер подключен");
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          handleServerMessage(msg);
        };
        ws.onclose = () => {
          // Если сервер не настроен, переходим на автономный локальный таймер
          setTimeout(startFallbackCycle, 1000);
        };
      } catch (e) {
        startFallbackCycle();
      }
    }

    function handleServerMessage(msg) {
      if (msg.type === "online_count" || msg.type === "init") {
        if (msg.online) document.getElementById('onlineCount').innerText = msg.online;
      }
      if (msg.type === "init") {
        if (msg.history) { gameHistory = msg.history; renderHistory(); }
        if (msg.bets) { allBetsList = msg.bets; renderCompactBets(); }
      }
      if (msg.type === "tick") {
        document.getElementById('statusPanel').innerHTML = `Делайте ваши ставки <span class="countdown-pill">${msg.time_left}с</span>`;
      }
      if (msg.type === "new_bet") {
        registerNewBet(msg.bet);
      }
      if (msg.type === "phase_betting") {
        roundPhase = "betting";
        myBets = {};
        allBetsList = [];
        document.querySelectorAll('.table-badge').forEach(b => b.remove());
        renderCompactBets();
        document.getElementById('statusPanel').innerHTML = `Делайте ваши ставки <span class="countdown-pill">${msg.time_left}с</span>`;
      }
      if (msg.type === "phase_spinning") {
        roundPhase = "spinning";
        document.getElementById('statusPanel').innerHTML = `⚠️ СТАВКИ СДЕЛАНЫ! Шарик запущен...`;
        animateSpin(msg.win_index, msg.win_number, msg.duration, () => {});
      }
      if (msg.type === "phase_result") {
        roundPhase = "result";
        gameHistory = msg.history;
        renderHistory();
        const payout = calculateMyPayout(msg.win_number);
        const color = (msg.win_number === 0) ? 'Зеро' : (redNumbers.includes(msg.win_number) ? 'Красное' : 'Чёрное');
        if (payout > 0) {
          balance += payout;
          saveBalance();
          document.getElementById('statusPanel').innerHTML = `🎉 Выпало: <b>${msg.win_number} (${color})</b>! Ваш выигрыш: <b>+${payout} 🪙</b>`;
          safeHaptic('win');
        } else {
          document.getElementById('statusPanel').innerHTML = `Выпало: <b>${msg.win_number} (${color})</b>. Новый раунд скоро...`;
        }
      }
    }

    // Резервный таймер (работает, если сервер Render ещё не развернут)
    let fallbackTimer = null;
    let fallbackTime = 15;
    function startFallbackCycle() {
      if (fallbackTimer) return;
      fallbackTimer = setInterval(() => {
        if (roundPhase === "betting") {
          fallbackTime--;
          if (fallbackTime <= 0) {
            roundPhase = "spinning";
            document.getElementById('statusPanel').innerHTML = `⚠️ СТАВКИ СДЕЛАНЫ! Шарик запущен...`;
            const winIdx = Math.floor(Math.random() * totalSlices);
            const winNum = wheelOrder[winIdx];
            animateSpin(winIdx, winNum, 5200, () => {
              roundPhase = "result";
              gameHistory.push(winNum);
              renderHistory();
              const payout = calculateMyPayout(winNum);
              const col = (winNum === 0) ? 'Зеро' : (redNumbers.includes(winNum) ? 'Красное' : 'Чёрное');
              if (payout > 0) {
                balance += payout;
                saveBalance();
                document.getElementById('statusPanel').innerHTML = `🎉 Выпало: <b>${winNum} (${col})</b>! Вы выиграли: <b>+${payout} 🪙</b>`;
                safeHaptic('win');
              } else {
                document.getElementById('statusPanel').innerHTML = `Выпало: <b>${winNum} (${col})</b>. Новый раунд...`;
              }
              setTimeout(() => {
                roundPhase = "betting";
                fallbackTime = 15;
                myBets = {};
                allBetsList = [];
                document.querySelectorAll('.table-badge').forEach(b => b.remove());
                renderCompactBets();
              }, 4000);
            });
          } else {
            document.getElementById('statusPanel').innerHTML = `Делайте ваши ставки <span class="countdown-pill">${fallbackTime}с</span>`;
          }
        }
      }, 1000);
    }

    // Инициализация
    loadBalance();
    buildBoard();
    renderHistory();
    drawWheel(0, null);
    connectWebSocket();
  </script>
</body>
