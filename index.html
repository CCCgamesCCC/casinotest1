<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casino Mini App</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #121214;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .balance-box {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 25px;
      color: #f5a623;
    }
    .machine {
      background: #1f2024;
      padding: 20px;
      border-radius: 20px;
      border: 2px solid #2d3038;
      display: flex;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .reel {
      width: 75px;
      height: 90px;
      background: #0d0d0f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 1px solid #333;
    }
    .result-text {
      margin-top: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }
    .controls {
      margin-top: 30px;
    }
    .spin-btn {
      background: #e50914;
      color: #ffffff;
      border: none;
      padding: 16px 50px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    .spin-btn:active {
      transform: scale(0.95);
      background: #b80710;
    }
  </style>
</head>
<body>

  <div class="balance-box">Баланс: <span id="balance">1000</span> 🪙</div>

  <div class="machine">
    <div class="reel" id="r1">🍒</div>
    <div class="reel" id="r2">🍋</div>
    <div class="reel" id="r3">7️⃣</div>
  </div>

  <div class="result-text" id="status">Нажмите кнопку «КРУТИТЬ»!</div>

  <div class="controls">
    <button class="spin-btn" id="btn" onclick="startSpin()">КРУТИТЬ</button>
  </div>

  <script>
    var symbols = ["🍒", "🍋", "🍇", "🔔", "7️⃣"];
    var balance = 1000;
    var bet = 50;
    var spinning = false;

    function getRandomItem() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function startSpin() {
      if (spinning) return;

      if (balance < bet) {
        document.getElementById("status").innerText = "Недостаточно монет!";
        return;
      }

      spinning = true;
      balance = balance - bet;
      document.getElementById("balance").innerText = balance;
      document.getElementById("status").innerText = "Крутим...";
      document.getElementById("btn").style.opacity = "0.5";

      var count = 0;
      var timer = setInterval(function() {
        document.getElementById("r1").innerText = getRandomItem();
        document.getElementById("r2").innerText = getRandomItem();
        document.getElementById("r3").innerText = getRandomItem();
        count++;

        if (count > 15) {
          clearInterval(timer);

          var s1 = getRandomItem();
          var s2 = getRandomItem();
          var s3 = getRandomItem();

          document.getElementById("r1").innerText = s1;
          document.getElementById("r2").innerText = s2;
          document.getElementById("r3").innerText = s3;

          var win = 0;
          if (s1 === s2 && s2 === s3) {
            win = 250;
            document.getElementById("status").innerText = "🔥 3 в ряд! +" + win;
          } else if (s1 === s2 || s2 === s3 || s1 === s3) {
            win = 50;
            document.getElementById("status").innerText = "🎉 Пара! Возврат ставки +" + win;
          } else {
            document.getElementById("status").innerText = "Мимо. Ещё разок!";
          }

          balance = balance + win;
          document.getElementById("balance").innerText = balance;
          spinning = false;
          document.getElementById("btn").style.opacity = "1";
        }
      }, 70);
    }
  </script>
</body>
</html>
