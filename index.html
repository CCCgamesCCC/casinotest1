<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casino Mini App</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #121214;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .balance-box {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f5a623;
    }
    .machine {
      background: #1f2024;
      padding: 20px;
      border-radius: 20px;
      border: 2px solid #2d3038;
      display: flex;
      gap: 12px;
    }
    .reel {
      width: 75px;
      height: 90px;
      background: #0d0d0f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 1px solid #333;
    }
    .controls {
      margin-top: 25px;
    }
    .spin-btn {
      background: #e50914;
      color: #ffffff;
      border: none;
      padding: 18px 50px;
      font-size: 1.3rem;
      font-weight: 800;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    .spin-btn:active {
      transform: scale(0.96);
      background: #b80710;
    }
    .result-text {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 25px;
    }
    /* Панель диагностики на экране */
    #logBox {
      margin-top: 25px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #444;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #a0ffa0;
      max-width: 90%;
      word-break: break-word;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="balance-box">Баланс: <span id="balance">1000</span> 🪙</div>

  <div class="machine">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">7️⃣</div>
  </div>

  <div class="result-text" id="result">Нажмите кнопку</div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn" type="button">КРУТИТЬ</button>
  </div>

  <!-- Окно отладки -->
  <div id="logBox">Статус: загрузка (Версия 3.0)...</div>

  <script>
    const logEl = document.getElementById("logBox");
    function log(msg) {
      logEl.innerHTML += "<br>▶ " + msg;
    }

    // Выводим все системные ошибки прямо на экран
    window.onerror = function(msg, url, line) {
      log("<span style='color:red'>ОШИБКА: " + msg + " (стр: " + line + ")</span>");
      return false;
    };

    log("Скрипт стартовал");

    const symbols = ["🍒", "🍋", "🍇", "🔔", "7️⃣"];
    let balance = 1000;
    const bet = 50;
    let isSpinning = false;

    const r1 = document.getElementById("reel1");
    const r2 = document.getElementById("reel2");
    const r3 = document.getElementById("reel3");
    const balEl = document.getElementById("balance");
    const resEl = document.getElementById("result");
    const btn = document.getElementById("spinBtn");

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function doSpin() {
      log("Нажатие зарегистрировано!");

      if (isSpinning) {
        log("Уже крутится, ждём...");
        return;
      }

      if (balance < bet) {
        resEl.innerText = "Недостаточно монет!";
        log("Баланс слишком мал");
        return;
      }

      isSpinning = true;
      balance -= bet;
      balEl.innerText = balance;
      btn.disabled = true;
      resEl.innerText = "Барабаны крутятся...";

      let step = 0;
      const timer = setInterval(() => {
        r1.innerText = getRandomSymbol();
        r2.innerText = getRandomSymbol();
        r3.innerText = getRandomSymbol();
        step++;

        if (step > 12) {
          clearInterval(timer);

          const s1 = getRandomSymbol();
          const s2 = getRandomSymbol();
          const s3 = getRandomSymbol();
          r1.innerText = s1;
          r2.innerText = s2;
          r3.innerText = s3;

          let win = 0;
          if (s1 === s2 && s2 === s3) {
            win = 250;
            resEl.innerText = "🎉 Выигрыш: +" + win;
          } else if (s1 === s2 || s2 === s3 || s1 === s3) {
            win = 50;
            resEl.innerText = "Пара! Возврат: +" + win;
          } else {
            resEl.innerText = "Мимо! Попробуйте снова.";
          }

          balance += win;
          balEl.innerText = balance;
          isSpinning = false;
          btn.disabled = false;
          log("Спин завершен, баланс: " + balance);
        }
      }, 80);
    }

    // Привязываем обработчик
    btn.onclick = function() {
      doSpin();
    };

    log("Кнопка готова к нажатию");
  </script>
</body>
</html>
